<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Heat computer</title>
<style>
:root{--bg:#11151a;--panel:#191f26;--edge:#26303a;--text:#e6ecf2;--dim:#8b98a5;--faint:#5d6975;--fire:#ff7a3d;--cold:#5aa9e0;--ok:#57c98a;--warn:#e2b44a;--alarm:#ff6b6b;--track:#222b34}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px 22px}
.eyebrow{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--faint)}
.temp{font:700 54px/1.05 ui-monospace,Menlo,Consolas,monospace;color:var(--cold);margin:4px 0 2px}
.temp.bad{color:var(--alarm)}.temp.hand{color:var(--warn)}
.src{color:var(--dim);font-size:14px;max-width:560px}
.right{text-align:right}
.clock{font:400 26px/1.1 ui-monospace,Menlo,Consolas,monospace}
.date{color:var(--dim);font-size:14px}
.speed{color:var(--dim);font-size:13px;margin-top:6px;max-width:420px;margin-left:auto}
#banner{display:none;margin:12px 0 0;padding:12px 16px;border-radius:10px;font-weight:600}
#banner.stale{display:block;background:#3a2c0e;border:1px solid var(--warn);color:var(--warn)}
#banner.dead{display:block;background:#3a1414;border:1px solid var(--alarm);color:var(--alarm)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{text-align:left}.speed{margin-left:0}.temp{font-size:44px}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px 20px}
.card.remote{border-style:dashed}
.top{display:flex;justify-content:space-between;gap:14px}
.name{color:var(--dim);font:600 12px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
.headline{font-size:19px;font-weight:600;margin:6px 0 4px}
.why{color:var(--dim);font-size:14px}
.flag{margin-top:8px;color:var(--warn);font-size:14px}
.badge{font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;text-align:right;color:var(--faint)}
.badge.on{color:var(--fire)}
.elapsed{color:var(--dim);font-size:13px;text-align:right;margin-top:4px}
.cd{margin-top:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cd .n{font:600 22px ui-monospace,Menlo,Consolas,monospace}
.cd .l{color:var(--dim);font-size:14px;white-space:pre-line}
.sec{margin-top:16px}
.sec .t{display:flex;justify-content:space-between;gap:12px;font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.sec .t span:last-child{color:var(--dim);text-transform:none;letter-spacing:0;font:13px/1.3 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:right}
svg.strip{display:block;width:100%;height:30px;border-radius:5px}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:3px}
.wide{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:18px 20px;margin-top:16px}
details summary{cursor:pointer;color:var(--dim);font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
pre{margin:12px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--dim);font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;max-height:340px;overflow:auto}
footer{color:var(--faint);font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="where">OUTSIDE TEMPERATURE</div>
      <div class="temp" id="temp">--</div>
      <div class="src" id="src"></div>
    </div>
    <div class="right">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date"></div>
      <div class="speed" id="speed"></div>
    </div>
  </header>
  <div id="banner"></div>
  <div class="grid" id="boilers"></div>
  <div class="wide">
    <div class="sec" style="margin-top:0"><div class="t"><span>Outside temperature, last 24 hours</span><span id="tnote"></span></div>
    <svg class="strip" id="tchart" viewBox="0 0 1000 90" preserveAspectRatio="none" style="height:90px;background:var(--track)"></svg>
    <div class="axis" id="taxis"></div></div>
  </div>
  <div class="wide"><details><summary>What the computer has been saying (newest at the bottom)</summary><pre id="log"></pre></details></div>
  <footer id="foot">Loading...</footer>
</div>
<script>
var DATA_URL="https://raw.githubusercontent.com/farringtoninnjohn-droid/heat-computer/data/status.json";
var D=null,loadedAt=0,failed=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function local(t){return new Date((t+D.tz_offset)*1000)}
function clock(t){var d=local(t),h=d.getUTCHours(),m=d.getUTCMinutes();return(h%12||12)+":"+(m<10?"0":"")+m+(h<12?" am":" pm")}
function hourLabel(t){var h=local(t).getUTCHours();return(h%12||12)+(h<12?"a":"p")}
function ago(s){s=Math.max(0,Math.round(s));if(s<90)return s+" seconds";var m=Math.round(s/60);if(m<90)return m+" minutes";var h=Math.round(s/360)/10;return h+" hours"}
function strip(runs,t0,t1,color,opts){
  var W=1000,span=t1-t0,o=['<svg class="strip" viewBox="0 0 '+W+' 30" preserveAspectRatio="none"><rect width="'+W+'" height="30" fill="var(--track)"/>'];
  var first=opts&&opts.since;
  if(first&&first>t0){var e=(first-t0)/span*W;o.push('<rect width="'+e+'" height="30" fill="#161b21"/>')}
  var start=Math.ceil(t0/3600)*3600;
  for(var t=start;t<=t1;t+=3600){var x=(t-t0)/span*W;o.push('<line x1="'+x+'" x2="'+x+'" y1="0" y2="30" stroke="#2c3742" stroke-width="1" vector-effect="non-scaling-stroke"/>')}
  (runs||[]).forEach(function(r){var a=Math.max(r[0],t0),b=Math.min(r[1],t1);if(b<=a)return;var x=(a-t0)/span*W,w=Math.max(2,(b-a)/span*W);o.push('<rect x="'+x+'" width="'+w+'" height="30" fill="'+color+'"/>')});
  if(opts&&opts.now){var nx=(opts.now-t0)/span*W;o.push('<line x1="'+nx+'" x2="'+nx+'" y1="0" y2="30" stroke="#e6ecf2" stroke-width="2" vector-effect="non-scaling-stroke"/>')}
  o.push('</svg>');
  var ax='<div class="axis">';for(var i=0;i<=4;i++){ax+='<span>'+clock(t0+span*i/4)+'</span>'}ax+='</div>';
  return o.join("")+ax}
function render(){
  var g=D.generated;
  $("temp").textContent=D.temp.text;$("temp").className="temp"+(D.temp.bad?" bad":(D.temp.hand?" hand":""));
  $("src").textContent=D.temp.source;$("clock").textContent=D.clock;$("date").textContent=D.date;$("speed").textContent=D.speed;
  $("where").textContent="OUTSIDE TEMPERATURE · "+D.building.toUpperCase();
  document.title=D.building+" heat computer";
  var out=[];
  D.boilers.forEach(function(b){
    var on=b.state==="ON";
    out.push('<div class="card'+(b.remote?" remote":"")+'"><div class="top"><div><div class="name">'+esc(b.name)+'</div><div class="headline">'+esc(b.headline)+'</div><div class="why">'+esc(b.why)+'</div>'+(b.flag?'<div class="flag">'+esc(b.flag)+'</div>':"")+'</div><div><div class="badge'+(on?" on":"")+'">'+esc(b.state)+'</div><div class="elapsed">'+esc(b.elapsed)+'</div></div></div>'
    +'<div class="cd"><span class="n">'+esc(b.countdown)+'</span><span class="l">'+esc(b.cd_label)+'</span></div>'
    +'<div class="sec"><div class="t"><span>Running time, last 24 hours</span><span>'+esc(b.strip_label)+'</span></div>'+strip(b.runs,g-86400,g,"#ff7a3d",{since:b.since,now:g})+'</div>'
    +'<div class="sec"><div class="t"><span>Next 24 hours</span><span>'+esc(b.plan_label)+'</span></div>'+strip(b.plan,g,g+86400,"#b8582c",{})+'</div></div>')});
  $("boilers").innerHTML=out.join("");
  // temperature chart
  var T=D.temps||[];
  if(T.length>1){var lo=Infinity,hi=-Infinity;T.forEach(function(p){lo=Math.min(lo,p[1]);hi=Math.max(hi,p[1])});
    if(hi-lo<4){var mid=(hi+lo)/2;lo=mid-2;hi=mid+2}
    var t0=g-86400,pts=T.map(function(p){return((p[0]-t0)/86400*1000).toFixed(1)+","+(82-(p[1]-lo)/(hi-lo)*74).toFixed(1)}).join(" ");
    $("tchart").innerHTML='<polyline points="'+pts+'" fill="none" stroke="#5aa9e0" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    $("tnote").textContent="low "+lo.toFixed(0)+"°  ·  high "+hi.toFixed(0)+"°";
    var ax="";for(var i=0;i<=4;i++){ax+="<span>"+clock(t0+86400*i/4)+"</span>"}$("taxis").innerHTML=ax}
  else{$("tchart").innerHTML="";$("tnote").textContent="not enough readings yet"}
  $("log").textContent=(D.log||[]).join("\n");
  tick()}
function tick(){
  if(!D)return;
  var age=Date.now()/1000-D.generated,b=$("banner");
  if(failed&&age>600){b.className="dead";b.textContent="Can't load the latest data from GitHub ("+failed+"). Showing what it said "+ago(age)+" ago."}
  else if(age>180){b.className=age>900?"dead":"stale";b.textContent="This page hasn't been updated for "+ago(age)+". The heat computer may be off or have lost its internet. What you see is how things were then."}
  else b.className="";
  $("foot").textContent="Updated "+clock(D.generated)+" ("+ago(age)+" ago) · heat computer version "+D.version+" · this page refreshes by itself"}
function load(){
  var x=new XMLHttpRequest();x.open("GET",DATA_URL+(DATA_URL.indexOf("?")<0?"?":"&")+"t="+Date.now());
  x.onload=function(){if(x.status===200){try{D=JSON.parse(x.responseText);failed=null;render()}catch(e){failed="unreadable data"}}else failed="HTTP "+x.status;tick()};
  x.onerror=function(){failed="no connection";tick()};x.send()}
load();setInterval(load,30000);setInterval(tick,5000);
</script>
</body>
</html>
